<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rádio Vida Nova — Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0b1020, #121833);
      color: #f4f6fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .widget {
      width: 100%;
      max-width: 360px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(8px);
    }
    .widget-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .widget-icon {
      font-size: 24px;
      color: #f5c542;
    }
    .widget-title {
      font-size: 14px;
      font-weight: 600;
    }
    .widget-subtitle {
      font-size: 11px;
      color: #a9b0c6;
    }
    .live-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #ffb3c1;
      font-weight: 600;
    }
    .live-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ff4d6d;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .track-info {
      text-align: center;
      margin-bottom: 12px;
    }
    .track-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 12px;
      color: #a9b0c6;
      margin-top: 2px;
    }
    .genre-tag {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      color: #1a1200;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #f4f6fb;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.15); }
    .play-btn {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #f5c542, #ff8a3d);
      color: #1a1200;
      font-size: 18px;
      border: none;
      box-shadow: 0 4px 12px rgba(245,197,66,0.3);
    }
    .play-btn:hover { transform: scale(1.08); }
    .progress {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #a9b0c6;
      margin-bottom: 8px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      cursor: pointer;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f5c542, #ff8a3d);
      border-radius: 999px;
      transition: width 0.1s linear;
    }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #a9b0c6;
    }
    .volume-row input { flex: 1; accent-color: #f5c542; }
    .status {
      text-align: center;
      font-size: 11px;
      color: #a9b0c6;
      margin-top: 8px;
      min-height: 14px;
    }
    .footer-link {
      text-align: center;
      margin-top: 8px;
      font-size: 10px;
    }
    .footer-link a {
      color: #f5c542;
      text-decoration: none;
    }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="widget">
    <div class="widget-header">
      <span class="widget-icon">🎵</span>
      <div>
        <div class="widget-title">Rádio Vida Nova</div>
        <div class="widget-subtitle">Web Rádio Evangélica</div>
      </div>
      <div class="live-badge">
        <span class="dot"></span> AO VIVO
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Bem-vindo</div>
      <div class="track-artist" id="trackArtist">Clique em ▶ para ouvir</div>
      <span class="genre-tag" id="trackGenre" style="display:none;"></span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="Anterior">⏮</button>
      <button class="ctrl-btn play-btn" id="playBtn" aria-label="Tocar/Pausar">▶</button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Próxima">⏭</button>
    </div>

    <div class="progress">
      <span id="currentTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="duration">0:00</span>
    </div>

    <div class="volume-row">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
    </div>

    <div class="status" id="statusText">Pronto para tocar</div>

    <div class="footer-link">
      <a href="https://josiasromilda54-cell.github.io/radio-evangelica/" target="_blank">Abrir rádio completa →</a>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script>
    // Biblioteca de louvores (mesma do site principal)
    const LIBRARY = [
      { title: 'He rose again the third day', artist: 'Hino Clássico', genre: 'sertanejo', src: 'https://archive.org/download/easter_hymns_1706_librivox/easterhymns_05_various_128kb.mp3', dur: '2:00' },
      { title: 'Now is Christ risen from the Dead', artist: 'Hino Clássico', genre: 'sertanejo', src: 'https://archive.org/download/easter_hymns_1706_librivox/easterhymns_04_various_128kb.mp3', dur: '2:15' },
      { title: 'The Lord is risen indeed', artist: 'Hino Clássico', genre: 'classico', src: 'https://archive.org/download/easter_hymns_1706_librivox/easterhymns_08_various_128kb.mp3', dur: '1:30' },
      { title: 'He is risen, he is not here', artist: 'Hino Clássico', genre: 'classico', src: 'https://archive.org/download/easter_hymns_1706_librivox/easterhymns_13_various_128kb.mp3', dur: '1:15' },
      { title: 'King of kings, and Lord of lords', artist: 'Hino Clássico', genre: 'orquestrado', src: 'https://archive.org/download/easter_hymns_1706_librivox/easterhymns_14_various_128kb.mp3', dur: '1:50' },
      { title: 'I know that my Redeemer liveth', artist: 'Hino Clássico', genre: 'orquestrado', src: 'https://archive.org/download/easter_hymns_1706_librivox/easterhymns_34_various_128kb.mp3', dur: '1:05' },
      { title: 'O death, where is thy sting?', artist: 'Hino Clássico', genre: 'adoracao', src: 'https://archive.org/download/easter_hymns_1706_librivox/easterhymns_45_various_128kb.mp3', dur: '1:15' },
      { title: 'Alleluja, for the Lord God Omnipotent reigneth', artist: 'Hino Clássico', genre: 'adoracao', src: 'https://archive.org/download/easter_hymns_1706_librivox/easterhymns_54_various_128kb.mp3', dur: '1:20' },
    ];

    const GENRE_COLORS = { sertanejo: '#e8a838', mpb: '#4caf50', classico: '#9c27b0', orquestrado: '#2196f3', adoracao: '#ff5722' };
    const GENRE_LABELS = { sertanejo: 'Sertanejo Gospel', mpb: 'MPB Gospel', classico: 'Clássico', orquestrado: 'Orquestrado', adoracao: 'Adoração' };

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeEl = document.getElementById('volume');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const trackGenre = document.getElementById('trackGenre');
    const statusText = document.getElementById('statusText');

    let currentIndex = 0;
    let isPlaying = false;

    function formatTime(s) {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + sec.toString().padStart(2, '0');
    }

    function loadTrack(index, autoplay) {
      currentIndex = (index + LIBRARY.length) % LIBRARY.length;
      const track = LIBRARY[currentIndex];
      audio.src = track.src;
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      trackGenre.textContent = GENRE_LABELS[track.genre] || '';
      trackGenre.style.background = GENRE_COLORS[track.genre] || '#888';
      trackGenre.style.display = 'inline-block';
      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      durationEl.textContent = track.dur;
      if (autoplay) {
        audio.play().then(() => {
          isPlaying = true;
          playBtn.textContent = '⏸';
          statusText.textContent = 'Tocando: ' + track.title;
        }).catch(() => {
          isPlaying = false;
          playBtn.textContent = '▶';
          statusText.textContent = 'Clique em ▶ para ouvir';
        });
      }
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶';
        statusText.textContent = 'Pausado';
      } else {
        if (!audio.src) loadTrack(currentIndex, false);
        isPlaying = true;
        playBtn.textContent = '⏸';
        audio.play().then(() => {
          statusText.textContent = 'Tocando: ' + LIBRARY[currentIndex].title;
        }).catch(() => {
          isPlaying = false;
          playBtn.textContent = '▶';
          statusText.textContent = 'Clique em ▶ para ouvir';
        });
      }
    });

    prevBtn.addEventListener('click', () => loadTrack(currentIndex - 1, isPlaying));
    nextBtn.addEventListener('click', () => loadTrack(currentIndex + 1, isPlaying));

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', () => loadTrack(currentIndex + 1, true));
    audio.addEventListener('error', () => {
      statusText.textContent = 'Erro ao carregar. Pulando...';
      setTimeout(() => loadTrack(currentIndex + 1, true), 1500);
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      if (audio.duration) audio.currentTime = pct * audio.duration;
    });

    volumeEl.addEventListener('input', () => { audio.volume = parseFloat(volumeEl.value); });

    audio.muted = false;
    audio.volume = 1;
    loadTrack(0, false);
    statusText.textContent = 'Pronto! Clique em ▶';
  </script>
</body>
</html>
